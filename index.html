<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#212529">
  <title>ne yesek?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/nes.css@2.3.0/css/nes.min.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1 class="app-title">ne yesek?</h1>
      <button id="open-drawer" class="nes-btn" aria-label="Yemek listesini aç" type="button">≡</button>
    </header>

    <nav id="preset-chips" class="preset-chips" aria-label="Yemek filtresi"></nav>

    <section class="slot-section">
      <div id="slot" class="slot" role="status" aria-live="polite"></div>
      <p id="info" class="info"></p>
    </section>

    <button id="spin" class="nes-btn is-success spin-btn" type="button">ÇEVİR</button>
  </main>

  <dialog id="drawer" class="drawer">
    <header class="drawer-header">
      <h2>Yemek Listesi</h2>
      <button id="close-drawer" class="nes-btn" aria-label="Kapat" type="button">×</button>
    </header>
    <p id="drawer-counter" class="drawer-counter"></p>
    <ul id="food-list" class="food-list"></ul>
    <button id="show-all" class="nes-btn" type="button">Tümünü Göster</button>
  </dialog>

  <script type="module" src="src/app.js"></script>
</body>
</html>
